plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.HelloWorld'
version = '0.0.1-SNAPSHOT'
description = 'TripManagementSystem'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Lombok (correct setup)
    compileOnly "org.projectlombok:lombok:1.18.42"
    annotationProcessor "org.projectlombok:lombok:1.18.42"

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
/*
    // MapStruct
    implementation "org.mapstruct:mapstruct:1.7.0.Beta1"
    annotationProcessor "org.mapstruct:mapstruct-processor:1.7.0.Beta1"*/

    //FlyWay for Migration
    implementation 'org.flywaydb:flyway-core:10.20.0'
    implementation 'org.flywaydb:flyway-mysql'
    //implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'com.google.cloud.sql:mysql-socket-factory-connector-j-8:1.5.0'


    // Jakarta Validation (IMPORTANT)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    //JpaRepository
    //implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    //runtimeOnly 'com.mysql:mysql-connector-j'



    //Bcrypt
//    dependencies {
//        implementation 'org.springframework.boot:spring-boot-starter-security'
//    }

    //JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5' // for JSON serialization/deserialization

}

jacoco {
    toolVersion = "0.8.11"
}

test {
    finalizedBy jacocoTestReport
}

tasks.named('test') {
    useJUnitPlatform()
}
tasks.named("jacocoTestReport", JacocoReport) {
    dependsOn test
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        '**/dto/**',
                        '**/entity/**',
                        '**/config/**',
                        '**/exception/**'
                ])
            })
    )
}