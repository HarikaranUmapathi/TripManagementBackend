spring.application.name=TripManagementSystem


# --- MySQL Database Connection ---
spring.datasource.url=jdbc:mysql://localhost:3306/TripDetails?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Settings ---
spring.jpa.hibernate.ddl-auto=update
application.cors.allowed-origins=http://localhost:5173,http://localhost:5174
application.cors.allowed-methods=*
application.cors.allowed-headers=*
application.cors.allowed-credentials =true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Enable Flyway migrations
spring.flyway.enabled=true

# Location of migration scripts
spring.flyway.locations=classpath:db/migration

# Use baseline if your DB already has tables
spring.flyway.baseline-on-migrate=true

spring.flyway.validate-on-migrate=true
